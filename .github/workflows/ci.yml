name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend · Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.in
            backend/requirements.txt
            backend/requirements-dev.in
            backend/requirements-dev.txt
            backend/requirements-tools.txt

      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install -r backend/requirements-tools.txt

      - name: Verify universal Python dependency locks
        run: python backend/scripts/lock_dependencies.py --check

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Audit Python runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --strict --progress-spinner=off --requirement backend/requirements.txt

      - name: Validate Docker Compose
        run: docker compose config --quiet

  frontend:
    name: Frontend · TypeScript, ESLint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

  containers:
    name: Containers · Docker Compose smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    env:
      COPILOT_ENVIRONMENT: production
      API_DOCS_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate ephemeral smoke-test secrets
        shell: bash
        run: |
          backend_token="$(openssl rand -hex 48)"
          demo_password="$(openssl rand -hex 24)"
          session_secret="$(openssl rand -hex 48)"
          echo "::add-mask::$backend_token"
          echo "::add-mask::$demo_password"
          echo "::add-mask::$session_secret"
          echo "BACKEND_SERVICE_TOKEN=$backend_token" >> "$GITHUB_ENV"
          echo "DEMO_ACCESS_PASSWORD=$demo_password" >> "$GITHUB_ENV"
          echo "SESSION_SECRET=$session_secret" >> "$GITHUB_ENV"

      - name: Build both production images
        run: docker compose build --pull backend frontend

      - name: Start the production Compose stack
        run: docker compose up --detach --no-build --wait --wait-timeout 180 backend frontend

      - name: Smoke-test health, login and API protection
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:8000/api/health > /tmp/backend-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/backend-health.json").read_text(encoding="utf-8"))
          assert payload.get("status") == "ok", payload
          assert isinstance(payload.get("version"), str) and payload["version"], payload
          PY

          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:3000/login > /tmp/frontend-login.html
          grep --fixed-strings --quiet "Connexion au workspace" /tmp/frontend-login.html

          protected_status="$(curl --silent --show-error \
            --output /tmp/backend-protected.json \
            --write-out '%{http_code}' \
            http://127.0.0.1:8000/api/overview)"
          test "$protected_status" = "401"
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/backend-protected.json").read_text(encoding="utf-8"))
          assert payload == {"detail": "Authentification du service requise."}, payload
          PY

      - name: Show container logs after a failure
        if: failure()
        timeout-minutes: 3
        run: docker compose logs --no-color || true

      - name: Stop and remove the smoke-test stack
        if: always()
        timeout-minutes: 5
        run: docker compose down --volumes --remove-orphans

  e2e:
    name: E2E · Robot Framework
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/robot/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install application dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r tests/robot/requirements.txt
          npm ci --prefix frontend

      - name: Run the real browser journey
        run: python -m robot --outputdir tests/robot/results tests/robot/enterprise_data_ia.robot

      - name: Upload Robot Framework evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-framework-results
          path: tests/robot/results/
          if-no-files-found: error
          retention-days: 14
