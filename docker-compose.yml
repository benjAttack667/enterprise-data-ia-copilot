services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: enterprise-data-ia-copilot-backend:local
    init: true
    restart: unless-stopped
    environment:
      COPILOT_ENVIRONMENT: ${COPILOT_ENVIRONMENT:-production}
      BACKEND_SERVICE_TOKEN: ${BACKEND_SERVICE_TOKEN:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      COPILOT_UPLOADS_DIR: /var/lib/copilot/uploads
      COPILOT_REPORTS_DIR: /var/lib/copilot/reports
      COPILOT_DATABASE_PATH: /var/lib/copilot/history.db
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - copilot-runtime:/var/lib/copilot
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: enterprise-data-ia-copilot-frontend:local
    init: true
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      BACKEND_SERVICE_TOKEN: ${BACKEND_SERVICE_TOKEN:-}
      DEMO_ACCESS_PASSWORD: ${DEMO_ACCESS_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

volumes:
  copilot-runtime:
